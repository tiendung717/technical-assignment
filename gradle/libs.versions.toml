[versions]
androidGradlePlugin = "9.3.2"
kotlin = "2.4.20"
ksp = "2.3.6"
secretsGradlePlugin = "2.0.1"
spotless = "8.10.2"

# AndroidX
androidx-core-ktx = "1.19.0"
androidx-datastore-preferences = "1.2.1"
androidx-splasscreen = "1.2.0"
androidx-workmanager = "2.11.2"
androidx-material = "1.13.0"

# Compose
composeBom = "2026.08.00"
activity-compose = "1.13.0"
navigation-compose = "2.9.6"
lifecycle-runtime-compose = "2.10.0"
lifecycle-viewmodel-compose = "2.10.0"

# Timber Log
log-timber = "5.0.1"

# Kotlinx Serialization
kotlinx-serialization = "2.4.20"
kotlinx-serialization-json = "1.11.0"
kotlinx-datetime = "0.8.0"

# Hilt
hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"

# Retrofit
retrofit = "3.0.0"
okhttp = "5.5.0"

# Coil
coil = "3.6.2"

[libraries]

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore-preferences" }
androidx-splasscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-splasscreen" }
androidx-workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidx-workmanager" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
compose-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
compose-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Timber Log
log-timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "log-timber" }

# Kotlinx Serialization JSON
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }


# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version = "1.0.0" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
compose = [
    "compose-foundation",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-runtime",
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-google-fonts",
    "compose-lifecycle-viewmodel",
    "compose-lifecycle-runtime",
    "compose-activity"
]

androidx = [
    "androidx-core-ktx",
    "androidx-datastore-preferences",
    "androidx-splasscreen",
    "androidx-workmanager",
    "androidx-material"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.2.10" }
secrets-gradle-plugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinx-serialization" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
